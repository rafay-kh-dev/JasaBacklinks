<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Self-hosted fonts preload - Ab Google se nahi, apni site se aayenge -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-v20-latin-regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans-v12-latin-500.woff2"
      crossorigin
    />

    <!-- FOUC fix - Jab tak CSS na aaye, page white na lage -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      #root {
        min-height: 100vh;
      }
    </style>

    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large"
    />

    <!-- Fallback SEO - Prerender har route ke liye isko replace kar dega -->
    <title>Jasa Backlinks | SEO Link Building Services</title>

      name="description"

    />
    <link rel="canonical" href="https://www.jasabacklinks.net/" />

    <meta property="og:site_name" content="Jasa Backlinks" />
    <meta
      property="og:title"
      content="Jasa Backlinks | SEO Link Building Services"
    />
    <meta
      property="og:description"
      content="Scale your Google rankings with Jasa Backlinks (by SeoHub Ltd). Verified DA/DR 50+ Homepage PBN Posts, Sidebar Blogrolls, .ID Regional, and .EDU/.GOV backlinks starting at $1/link."

    <meta property="og:url" content="https://www.jasabacklinks.net/" />
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Jasa Backlinks | SEO Link Building Services"
    />
    <meta
      name="twitter:description"
      content="Scale your Google rankings with Jasa Backlinks (by SeoHub Ltd). Verified DA/DR 50+ Homepage PBN Posts, Sidebar Blogrolls, .ID Regional, and .EDU/.GOV backlinks starting at $1/link."
    />

    <!-- Website Favicon (Updated to favicon.svg everywhere) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
